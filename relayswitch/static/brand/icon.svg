<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6C3BFF"/>
      <stop offset="0.55" stop-color="#3D5BFF"/>
      <stop offset="1" stop-color="#00C2A8"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.25" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#B8FFF2" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#B8FFF2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#shine)"/>

  <!-- idle route -->
  <g opacity="0.38">
    <path d="M50 64 C68 64 72 92 94 92" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round"/>
    <circle cx="96" cy="92" r="8" fill="#FFFFFF"/>
  </g>

  <!-- active route -->
  <path d="M26 64 H50 C68 64 72 36 94 36" fill="none" stroke="#FFFFFF"
        stroke-width="12" stroke-linecap="round"/>
  <circle cx="96" cy="36" r="22" fill="url(#glow)"/>
  <circle cx="96" cy="36" r="12" fill="#FFFFFF"/>
  <circle cx="96" cy="36" r="5" fill="#00C2A8"/>

  <!-- source node -->
  <circle cx="28" cy="64" r="11" fill="#FFFFFF"/>
  <circle cx="28" cy="64" r="4.5" fill="#5146FF"/>
</svg>
