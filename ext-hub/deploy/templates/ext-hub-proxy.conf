# /etc/nginx/snippets/ext-hub-proxy.conf  -  installed by setup-server.sh
# Common settings for every location that forwards to ext-hub.

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;   # app runs with TRUST_PROXY=1
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-Id      $request_id;
proxy_set_header Connection        "";                           # keep-alive to Node.js

proxy_connect_timeout 10s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;
