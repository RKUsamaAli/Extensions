<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>RelaySwitch</title>
  <link rel="stylesheet" href="../shared/ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="row">
    <span id="dot" class="dot"></span>
    <h1 class="grow">RelaySwitch</h1>
    <label class="switch" title="Proxy on/off">
      <input id="toggle" type="checkbox" aria-label="Proxy on/off">
      <span></span>
    </label>
  </header>

  <section id="empty" hidden>
    <p class="muted">No proxy yet. Add one to get started.</p>
    <button id="addFirst" class="primary">Add a proxy</button>
  </section>

  <section id="main" hidden>
    <label for="profile">Proxy</label>
    <input id="search" type="search" placeholder="Search proxies" aria-label="Search proxies" hidden>
    <select id="profile"></select>
    <p id="noMatch" class="muted" hidden>No matching proxies</p>

    <div class="status">
      <div class="row"><span id="spinner" class="spinner" hidden></span><span id="statusText">Off</span></div>
      <div id="ipLine" class="mono"></div>
      <div id="detail" class="muted"></div>
    </div>

    <div class="row actions">
      <button id="check">Check IP</button>
      <button id="newSession" hidden>New session</button>
    </div>
  </section>

  <p id="error" class="error" hidden></p>

  <label class="row setting" for="fabToggle">
    <span class="grow">Floating button on pages</span>
    <span class="switch small"><input id="fabToggle" type="checkbox" aria-label="Floating button on pages"><span></span></span>
  </label>

  <footer class="row">
    <a href="#" id="options" class="grow">Manage proxies</a>
  </footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
